<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Football Puzzle</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="./phaser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            color: #ffffff;
            z-index: 1000;
            font-size: 24px;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        #loading.hidden {
            opacity: 0;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid #4a6fa5;
            border-top-color: #88bbff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Стили для мобильных */
        @media (max-width: 768px) {
            #loading {
                font-size: 18px;
            }
        }

        /* Предотвращаем скролл */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>
    <div id="loading">
        <div class="loader"></div>
        <div>Загрузка игры...</div>
    </div>

    <div id="game-container"></div>

    <script src="./menu.js"></script>
    <script src="./game.js"></script>

    <script>
        // Скрываем загрузочный экран
        window.addEventListener('load', () => {
            const loading = document.getElementById('loading');
            if (loading) {
                setTimeout(() => {
                    loading.classList.add('hidden');
                    setTimeout(() => {
                        loading.style.display = 'none';
                    }, 500);
                }, 300);
            }
        });

        // Обработка ошибок Fullscreen для мобильных
        document.addEventListener('fullscreenerror', (e) => {
            console.warn('Fullscreen error:', e);
        });

        // Для iOS Safari - дополнительная обработка
        document.addEventListener('webkitfullscreenerror', (e) => {
            console.warn('Webkit fullscreen error:', e);
        });
    </script>
</body>

</html>
