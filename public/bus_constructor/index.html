<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Angry Football</title>

    <link rel="stylesheet" href="./ui.css">

    <script src="./phaser.min.js"></script>
    <script src="./UniformPipeline.js"></script>
    <script src="./objectFactory.js"></script>
    <script src="./Player.js"></script>
    <script src="./CameraManager.js"></script>
    <script src="./ui.js"></script>
    <script src="./Ball.js"></script>
    <script src="./BusManager.js"></script>
    <script src="./FootballGoal.js"></script>
    <script src="./Goalkeeper.js"></script>
    <script src="./ParticleEffects.js"></script>
</head>

<body>

    <div id="app">
        <div id="game-container">
            <div id="top-controls">
                <div id="top-left-buttons">
                    <button id="test-bus-btn" class="game-button game-button--test" type="button"
                        aria-label="Начать тест автобуса" title="Тест автобуса">
                        <img class="button-icon" src="./assets/UI/Test_button.png" alt="" aria-hidden="true"
                            draggable="false">
                    </button>

                    <button id="exit-test-btn" class="game-button" type="button" aria-label="Вернуться к настройке"
                        title="К настройке" hidden>
                        <img class="button-icon" src="./assets/UI/Go_to_settings.png" alt="" aria-hidden="true"
                            draggable="false">
                    </button>

                    <button id="fullscreen-btn" class="game-button" type="button"
                        aria-label="Переключить полный экран" title="Полный экран">
                        <img class="button-icon" src="./assets/UI/Full_screen.png" alt="" aria-hidden="true"
                            draggable="false">
                    </button>
                    <button id="restart-test-btn" class="game-button" type="button" aria-label="Перезапустить тест"
                        title="Перезапустить тест" hidden>
                        <img class="button-icon" src="./assets/UI/Restart.png" alt="" aria-hidden="true"
                            draggable="false">
                    </button>
                </div>

                <div id="top-center-buttons">
                    <button id="change-bus-btn" class="game-button" type="button"
                        aria-label="Сменить каркас" title="Сменить каркас">
                        <img class="button-icon" src="./assets/UI/Random_karkas.png" alt="" aria-hidden="true"
                            draggable="false">
                    </button>

                    <button id="random-lineup-btn" class="game-button" type="button"
                        aria-label="Расставить игроков случайно" title="Случайный состав">
                        <img class="button-icon" src="./assets/UI/Random_squad.png" alt="" aria-hidden="true"
                            draggable="false">
                    </button>
                </div>
            </div>

            <div id="test-hud">
                <div id="shot-types-panel" hidden>
                    <button class="shot-type-btn selected" type="button" data-shot-type="normal"
                        aria-label="Обычный удар" aria-pressed="true">
                        <span class="shot-type-icon">⚽</span>
                    </button>

                    <button class="shot-type-btn" type="button" data-shot-type="boost" aria-label="Ускорение"
                        aria-pressed="false">
                        <span class="shot-type-icon">⚡</span>
                        <span class="shot-type-count" id="boost-count">3</span>
                    </button>

                    <button class="shot-type-btn" type="button" data-shot-type="bomb" aria-label="Бомба"
                        aria-pressed="false">
                        <span class="shot-type-icon">💣</span>
                        <span class="shot-type-count" id="bomb-count">3</span>
                    </button>
                </div>

                <div id="shots-counter" hidden>
                    ⚽
                    <span id="shots-count">0</span>
                </div>
            </div>

            <div id="players-panel">
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
            </div>

        </div>
    </div>
    <div id="menu-overlay">

        <div class="menu-card">

            <h1 class="menu-title">
                Angry Football
            </h1>

            <div class="menu-actions">
                <button id="play-btn" class="play-btn" type="button">
                    Играть
                </button>
            </div>

        </div>

    </div>


    <!-- PHONE ROTATION -->
    <div id="rotate-overlay" role="dialog" aria-modal="true" aria-labelledby="rotate-message">

        <div class="rotate-card">
            <div class="rotate-icon" aria-hidden="true">
                📱
            </div>

            <p id="rotate-message">
                Поверните телефон горизонтально
            </p>
        </div>

    </div>
    <script src="./LineupController.js"></script>
    <script src="./BallInputController.js"></script>
    <script src="./HealthSystem.js"></script>
    <script src="./BusTestController.js"></script>
    <script src="./game.js"></script>
    <script src="./bootstrap.js"></script>
    <script src="./menu.js"></script>
</body>

</html>
