<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Angry Football</title>

    <link rel="stylesheet" href="./ui.css">

    <script src="./phaser.min.js"></script>
    <script src="./UniformPipeline.js"></script>
    <script src="./objectFactory.js"></script>
    <script src="./Player.js"></script>
    <script src="./CameraManager.js"></script>
    <script src="./ui.js"></script>
    <script src="./Ball.js"></script>
    <script src="./BusManager.js"></script>
</head>

<body>

    <div id="app">
        <div id="game-container">
            <button id="change-bus-btn" class="game-button" type="button">
                Сменить каркас
            </button>

            <div id="top-left-buttons">
                <button id="test-bus-btn" class="game-button game-button--test" type="button">
                    Тест автобуса
                </button>

                <button id="exit-test-btn" class="game-button" type="button" hidden>
                    К настройке
                </button>

                <button id="fullscreen-btn" class="game-button" type="button" aria-label="Переключить полный экран">
                    ⛶
                </button>
                <button id="restart-test-btn" class="game-button" type="button" hidden>
                    ↻
                </button>
            </div>

            <div id="players-panel">
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
                <div class="player-card">
                    <div class="player-photo"></div>
                </div>
            </div>

        </div>
    </div>
    <div id="menu-overlay">

        <div class="menu-card">

            <h1 class="menu-title">
                Angry Football
            </h1>

            <button id="play-btn" class="play-btn">
                Играть
            </button>

        </div>

    </div>


    <!-- PHONE ROTATION -->
    <div id="rotate-overlay">

        <div class="rotate-icon">
            📱
        </div>

        <p>
            Поверните телефон горизонтально
        </p>

    </div>
    <script src="./game.js"></script>
    <script src="./menu.js"></script>
</body>

</html>
