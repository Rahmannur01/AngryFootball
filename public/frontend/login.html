<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Angry Football</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://telegram.org/js/telegram-widget.js?22" async></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0A0D12 0%, #161D2B 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: #0F131C;
            border-radius: 24px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #888;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #161D2B;
            border: 2px solid transparent;
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #38BDF8;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }

        .btn-primary {
            background: #38BDF8;
            color: #0A0D12;
        }

        .btn-primary:hover {
            background: #0ea5e9;
        }

        .btn-secondary {
            background: #1E2636;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background: #2a3244;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
            color: #888;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #1E2636;
        }

        .divider::before {
            margin-right: 16px;
        }

        .divider::after {
            margin-left: 16px;
        }

        .oauth-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn-oauth {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px;
            background: #1E2636;
            border: 2px solid #2a3244;
            border-radius: 999px;
            color: #e0e0e0;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-oauth:hover {
            background: #2a3244;
            border-color: #38BDF8;
        }

        .btn-oauth svg {
            width: 20px;
            height: 20px;
        }

        .error {
            background: #dc2626;
            color: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .link {
            text-align: center;
            margin-top: 20px;
            color: #888;
        }

        .link a {
            color: #38BDF8;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .login-container {
                padding: 24px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Вход</h1>
        <p class="subtitle">Добро пожаловать в Angry Football</p>

        <div id="error" class="error"></div>

        <!-- OAuth Buttons -->
        <div class="oauth-buttons">
            <button class="btn-oauth" id="google-login">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Войти через Google
            </button>

            <button class="btn-oauth" id="telegram-login">
                <svg viewBox="0 0 24 24" fill="#0088cc">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
                </svg>
                Войти через Telegram
            </button>
        </div>

        <div class="divider">или</div>

        <!-- Email/Password Form -->
        <form id="login-form">
            <div class="form-group">
                <label for="username">Email или имя пользователя</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn btn-primary">Войти</button>
        </form>

        <div class="link">
            Нет аккаунта? <a href="./index.html">Зарегистрироваться</a>
        </div>
    </div>

    <script>
        const API_URL = '/angryfootball/api/auth';
        const CONFIG_URL = '/angryfootball/api/config';
        const TOKEN_KEY = 'angry-football.access-token';
        let googleClientId = '';

        fetch(CONFIG_URL)
            .then((response) => response.ok ? response.json() : {})
            .then((config) => { googleClientId = config.google_client_id || ''; })
            .catch(() => {});

        // Email/Password Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch(`${API_URL}/token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Login failed');
                }

                const data = await response.json();
                sessionStorage.setItem(TOKEN_KEY, data.access_token);
                location.href = './home.html';
            } catch (error) {
                showError('Неверное имя пользователя или пароль');
            }
        });

        // Google OAuth
        document.getElementById('google-login').addEventListener('click', () => {
            if (!googleClientId || !window.google) {
                showError('Вход через Google не настроен');
                return;
            }
            window.google.accounts.oauth2.initTokenClient({
                client_id: googleClientId,
                scope: 'email profile',
                callback: async (response) => {
                    try {
                        const res = await fetch(`${API_URL}/oauth/google`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                access_token: response.access_token
                            })
                        });

                        if (!res.ok) throw new Error('OAuth failed');

                        const data = await res.json();
                        sessionStorage.setItem(TOKEN_KEY, data.access_token);
                        location.href = './home.html';
                    } catch (error) {
                        showError('Не удалось войти через Google');
                    }
                }
            }).requestAccessToken();
        });

        // Telegram OAuth (using Telegram Login Widget)
        window.onTelegramAuth = async (user) => {
            try {
                const response = await fetch(`${API_URL}/oauth/telegram`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(user)
                });

                if (!response.ok) throw new Error('OAuth failed');

                const data = await response.json();
                sessionStorage.setItem(TOKEN_KEY, data.access_token);
                location.href = './home.html';
            } catch (error) {
                showError('Не удалось войти через Telegram');
            }
        };

        // Show error message
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

        // Check if already logged in
        if (sessionStorage.getItem(TOKEN_KEY)) {
            location.href = './home.html';
        }
    </script>
</body>
</html>
