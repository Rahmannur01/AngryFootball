services:
  postgres:
    image: postgres:15-alpine
    container_name: angryfootball_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-angryfootball}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-angryfootball}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: angryfootball_backend
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - ROOT_PATH=${ROOT_PATH:-}
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST must be set in .env}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USERNAME=${SMTP_USERNAME:?SMTP_USERNAME must be set in .env}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?SMTP_PASSWORD must be set in .env}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:?SMTP_FROM_EMAIL must be set in .env}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Angry Football}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-true}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
      - EMAIL_CODE_EXPIRE_MINUTES=${EMAIL_CODE_EXPIRE_MINUTES:-10}
      - EMAIL_CODE_RESEND_SECONDS=${EMAIL_CODE_RESEND_SECONDS:-60}
      - EMAIL_CODE_MAX_ATTEMPTS=${EMAIL_CODE_MAX_ATTEMPTS:-5}
      - EMAIL_CODE_MAX_SENDS_PER_HOUR=${EMAIL_CODE_MAX_SENDS_PER_HOUR:-5}
      - REGISTRATION_TOKEN_EXPIRE_MINUTES=${REGISTRATION_TOKEN_EXPIRE_MINUTES:-15}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
